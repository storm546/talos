name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r server/requirements.txt

      - name: Run tests
        run: python -m pytest server -q

  core:
    name: Core tests (Kotlin, JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Android app is deliberately not built here: :app needs the Android
      # SDK (compileSdk 35) plus its licence, which exists on the build kit only.
      # :core is plain Kotlin/JVM, so the core tests need nothing but a JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run tests
        run: ./gradlew --no-daemon :core:test
