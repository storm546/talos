<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#1d2b25">
  <!-- Figure 1 of the documentation: the three parts and the data flow. Only numbers cross the network. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#176148"/>
    </marker>
  </defs>
  <rect x="10" y="20" width="230" height="190" rx="10" fill="#eef4f0" stroke="#176148" stroke-width="1.5"/>
  <text x="125" y="44" text-anchor="middle" font-weight="700" font-size="15">Телефон (app)</text>
  <rect x="28" y="58" width="194" height="34" rx="5" fill="#fff" stroke="#9fb5a9"/>
  <text x="125" y="80" text-anchor="middle">Видео от камерата</text>
  <rect x="28" y="102" width="194" height="34" rx="5" fill="#fff" stroke="#9fb5a9"/>
  <text x="125" y="124" text-anchor="middle">MediaPipe: 33 точки на кадър</text>
  <rect x="28" y="146" width="194" height="34" rx="5" fill="#fff" stroke="#176148" stroke-width="1.5"/>
  <text x="125" y="168" text-anchor="middle" font-weight="700">core: ъгли, полет, височина</text>
  <text x="125" y="202" text-anchor="middle" font-size="11.5" fill="#4b5b53">видеото остава тук</text>
  <line x1="125" y1="92" x2="125" y2="101" stroke="#176148" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="125" y1="136" x2="125" y2="145" stroke="#176148" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="240" y1="115" x2="372" y2="115" stroke="#176148" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="306" y="103" text-anchor="middle" font-size="12">JSON, 14 полета</text>
  <text x="306" y="133" text-anchor="middle" font-size="12">HTTPS + токен</text>

  <rect x="375" y="40" width="160" height="150" rx="10" fill="#fff" stroke="#176148" stroke-width="1.5"/>
  <text x="455" y="64" text-anchor="middle" font-weight="700" font-size="15">Сървър</text>
  <text x="455" y="88" text-anchor="middle">REST API (FastAPI)</text>
  <text x="455" y="110" text-anchor="middle">роли, проверка на</text>
  <text x="455" y="126" text-anchor="middle">полетата, дневник</text>
  <rect x="400" y="140" width="110" height="34" rx="5" fill="#eef4f0" stroke="#9fb5a9"/>
  <text x="455" y="162" text-anchor="middle">SQLite: числа</text>

  <line x1="535" y1="115" x2="577" y2="115" stroke="#176148" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="40" width="130" height="150" rx="10" fill="#eef4f0" stroke="#176148" stroke-width="1.5"/>
  <text x="645" y="64" text-anchor="middle" font-weight="700" font-size="15">Браузър</text>
  <text x="645" y="92" text-anchor="middle">треньорски панел</text>
  <text x="645" y="116" text-anchor="middle">история, графики,</text>
  <text x="645" y="132" text-anchor="middle">CSV, потребители</text>
  <text x="645" y="166" text-anchor="middle" font-size="11.5" fill="#4b5b53">треньор, админ</text>
</svg>
