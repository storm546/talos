# Server only. TLS is terminated by a reverse proxy on the host, so the
# container port is published on loopback and never on a public interface.
services:
  jumpscan:
    build: .
    image: jumpscan-server:latest
    container_name: jumpscan
    restart: unless-stopped
    environment:
      JUMPSCAN_DB: /data/jumpscan.db
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:?Set FORWARDED_ALLOW_IPS to the trusted proxy address}
    volumes:
      - jumpscan-data:/data
    ports:
      - "127.0.0.1:8171:8000"

volumes:
  jumpscan-data:
