plugins {
    id 'org.jetbrains.kotlin.jvm'
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Usage: ./gradlew --no-daemon :core:batch -Pin=<dir> -Pout=<file.csv>  (relative paths resolve against the repo root)
tasks.register('batch', JavaExec) {
    group = 'verification'
    description = 'Scores every landmark CSV under -Pin and writes one result table to -Pout.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'jumpscan.core.BatchKt'
    doFirst {
        if (!project.hasProperty('in') || !project.hasProperty('out')) {
            throw new GradleException('Usage: :core:batch -Pin=<dir> -Pout=<file.csv>')
        }
        args rootProject.file(project.property('in')).path, rootProject.file(project.property('out')).path
    }
}

// Usage: :core:formBatch -Pin=<dir> -Pout=<file.jsonl> [-Pexercise=single_leg_squat -Pside=L -Pview=FRONT]
tasks.register('formBatch', JavaExec) {
    group = 'verification'
    description = 'Scores squat landmark CSVs, retaining every repetition and refusal in JSON lines.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'jumpscan.core.FormBatch'
    doFirst {
        if (!project.hasProperty('in') || !project.hasProperty('out')) {
            throw new GradleException('Usage: :core:formBatch -Pin=<dir> -Pout=<file.jsonl>')
        }
        args rootProject.file(project.property('in')).path, rootProject.file(project.property('out')).path,
            project.findProperty('exercise') ?: 'squat', project.findProperty('side') ?: 'none',
            project.findProperty('view') ?: 'AUTO'
    }
}
