plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'jumpscan.app'
    compileSdk 35
    defaultConfig {
        applicationId 'jumpscan.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'jumpscan.app.AppChecks'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    androidResources { noCompress += 'task' }
}

dependencies {
    implementation project(':core')
    // This release supplies x86_64 through tasks-core as well as the device ABIs.
    implementation 'com.google.mediapipe:tasks-vision:1.2.3'
}
