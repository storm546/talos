plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePath = providers.gradleProperty('jumpscanKeystore').orNull
def keystoreProperties = new Properties()
if (keystorePath != null) {
    file(keystorePath).withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'jumpscan.app'
    compileSdk 35
    defaultConfig {
        applicationId 'jumpscan.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.2'
        testInstrumentationRunner 'jumpscan.app.AppChecks'
    }
    signingConfigs {
        if (keystorePath != null) {
            release {
                storeFile file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            if (keystorePath != null) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    androidResources { noCompress += 'task' }
}

dependencies {
    implementation project(':core')
    // Debug builds retain x86_64 libraries for the emulator.
    implementation 'com.google.mediapipe:tasks-vision:1.2.3'
}
